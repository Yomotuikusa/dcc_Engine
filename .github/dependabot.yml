version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # PR 件数を抑え、レビュー負荷を一定に保つ
    open-pull-requests-limit: 5
    # 自動でラベル付けし、トリアージを容易にする
    labels:
      - dependencies
      - needs-review
    allow:
      - dependency-type: all
    # 個人スコープ依存 (electron-vite) は個別グループ化して watch する
    groups:
      electron-vite:
        patterns:
          - electron-vite
